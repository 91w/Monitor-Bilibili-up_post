<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>监听配置更新</title>
<style>body{font:17px system-ui;background:#f0f4f8;color:#15283c}main{max-width:680px;margin:60px auto;background:white;padding:32px;border-radius:18px}button{padding:12px 24px;margin-top:24px;background:#1762b3;color:white;border:0;border-radius:8px}pre{white-space:pre-wrap}</style>
<main><h1>更新监听配置</h1><p>选择电脑上的 config.json，更新 UP 名单、Cookie 或飞书设置。</p><p>保留消息队列与监听进度，不显示当前 Cookie。上传成功表示文件已应用，Cookie 是否有效需后续检查。</p><input type="file" id="file" accept=".json,application/json"><p id="preview"></p><button id="send">上传并应用</button><pre id="result"></pre></main>
<script>let data=null;const file=document.getElementById('file'),preview=document.getElementById('preview'),send=document.getElementById('send'),result=document.getElementById('result');file.onchange=async()=>{try{data=await file.files[0].text();let c=JSON.parse(data);preview.textContent='配置包含 '+(c.up_users||[]).length+' 个 UP 主。';}catch(e){data=null;preview.textContent='文件不是有效 JSON';}};send.onclick=async()=>{if(!data){result.textContent='请先选择有效配置文件';return}send.disabled=true;try{let r=await fetch('/config',{method:'POST',headers:{'Content-Type':'application/json'},body:data});result.textContent=r.ok?'更新成功，监听进程会自动重新加载。':'更新被拒绝，请检查 JSON、UP 名单、HTTPS webhook 和时间参数。';if(r.ok){data=null;file.value='';preview.textContent='';}}catch(e){result.textContent='连接中断，无法确认是否已应用；恢复后可重复上传同一配置。'}finally{send.disabled=false;}};</script></html>
